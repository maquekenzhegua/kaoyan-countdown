name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Prepare web assets (www)
        run: |
          mkdir -p www
          cp index.html solarlunar.min.js manifest.webmanifest www/
          cp -r img www/img
          cp icon-192.png icon-512.png apple-touch-icon.png www/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/shangan-kaoyan.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: shangan-kaoyan-apk
          path: dist/shangan-kaoyan.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: 上岸挂历 · 安卓安装包 v${{ github.run_number }}
          body: |
            28 考研上岸挂历安卓版。下载下方 shangan-kaoyan.apk 安装即可。

            - 九所名校校园照片轮换,可锁定目标院校
            - 日历挂历版式(含农历),初试日标红
            - 支持选择考研年份(27~30考研)
            - 完全离线可用
          files: dist/shangan-kaoyan.apk
